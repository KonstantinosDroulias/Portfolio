# konstantinosdroulias.com — Django blog + CMS. Source: hq/projects/portfolio/konstantinosdroulias-com
# Files: /srv/konstantinosdroulias  ·  service konstantinosdroulias  ·  certbot cert "konstantinosdroulias.com"
upstream konstantinosdroulias { server unix:/run/konstantinosdroulias/app.sock; }

server {
    listen 80; listen [::]:80;
    server_name konstantinosdroulias.com www.konstantinosdroulias.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://konstantinosdroulias.com$request_uri; }
}

server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name www.konstantinosdroulias.com;
    ssl_certificate /etc/letsencrypt/live/konstantinosdroulias.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konstantinosdroulias.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://konstantinosdroulias.com$request_uri;
}

server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name konstantinosdroulias.com;
    ssl_certificate /etc/letsencrypt/live/konstantinosdroulias.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konstantinosdroulias.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 12m;
    access_log /var/log/nginx/konstantinosdroulias.access.log;
    error_log  /var/log/nginx/konstantinosdroulias.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/xml application/rss+xml text/plain image/svg+xml application/ld+json;

    location /static/ {
        alias /srv/konstantinosdroulias/data/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        location ~* \.woff2$ { alias /srv/konstantinosdroulias/data/static/; expires 1y; add_header Cache-Control "public, immutable"; add_header Access-Control-Allow-Origin "*"; }
    }
    location /media/ {
        alias /srv/konstantinosdroulias/data/media/;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        location ~* \.(php|html?|js|svg)$ { return 404; }
    }
    location = /favicon.ico { alias /srv/konstantinosdroulias/data/static/img/favicon.svg; default_type image/svg+xml; expires 30d; }
    location /admin/login/ {
        limit_req zone=kd_login burst=5 nodelay;
        proxy_pass http://konstantinosdroulias;
        include /etc/nginx/snippets/konstantinosdroulias-proxy.conf;
    }
    location / {
        proxy_pass http://konstantinosdroulias;
        include /etc/nginx/snippets/konstantinosdroulias-proxy.conf;
    }
}
