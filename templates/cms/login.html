{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{document.querySelector('meta[name="color-scheme"]').content=localStorage.getItem("color-scheme")??"light dark"}catch(e){}</script>
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Konstantinos Droulias</title>
<link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
<link rel="stylesheet" href="{% static 'css/site.css' %}">
<link rel="stylesheet" href="{% static 'css/cms.css' %}">
</head>
<body class="login">
<main class="login__box">
  <a class="logo" href="{% url 'home' %}">Konstantinos Droulias</a>
  <div class="login__card">
    <p class="label">Admin</p>
    <h1>Sign in</h1>
    {% if error %}<p class="errorlist" role="alert">{{ error }}</p>{% endif %}
    <form method="post" class="login__form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field"><label for="u">Username</label><input type="text" id="u" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" required autofocus></div>
      <div class="field"><label for="p">Password</label><input type="password" id="p" name="password" autocomplete="current-password" required></div>
      <button class="btn btn--solid" type="submit">Sign in <svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
    </form>
  </div>
  <a class="label login__back" href="{% url 'home' %}">← Back to the site</a>
</main>
{% include "partials/icons.html" %}
<script src="{% static 'js/password.js' %}" defer></script>
</body>
</html>
