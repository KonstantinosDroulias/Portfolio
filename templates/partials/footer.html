<footer class="site-footer">
  <div class="wrap site-footer__in">
    <span>© {% now "Y" %} Konstantinos Droulias</span>
    <ul>
      {% for label, url in site.socials %}<li><a href="{{ url }}" rel="me noopener" target="_blank">{{ label }}</a></li>{% endfor %}
      <li><a href="{% url 'feed' %}">RSS</a></li>
      <li><a href="{% url 'privacy' %}">Privacy</a></li>
      {% if site.analytics_id %}<li><button type="button" class="linkish" data-consent-open>Cookie settings</button></li>{% endif %}
    </ul>
    <a class="to-top" href="#main">Back to top ↑</a>
  </div>
</footer>
