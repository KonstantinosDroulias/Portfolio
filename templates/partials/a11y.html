<button type="button" class="a11y-btn" popovertarget="a11y" aria-label="Accessibility options">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"><circle cx="12" cy="4.5" r="1.75" fill="currentColor" stroke="none"/><path d="M4 8.5l8 1.5 8-1.5M12 10v4.5M12 14.5L8.5 21M12 14.5l3.5 6.5"/></svg>
</button>
<div id="a11y" class="a11y" popover aria-labelledby="a11y-h">
  <div class="a11y__head">
    <h2 id="a11y-h" class="label">Accessibility</h2>
    <button type="button" class="a11y__close" popovertarget="a11y" popovertargetaction="hide" aria-label="Close accessibility options"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="a11y__group" role="group" aria-labelledby="a11y-size">
    <p id="a11y-size" class="a11y__label">Text size</p>
    <div class="a11y__seg">
      <button type="button" data-pick-size="0" aria-pressed="true">100%</button>
      <button type="button" data-pick-size="1" aria-pressed="false">115%</button>
      <button type="button" data-pick-size="2" aria-pressed="false">130%</button>
      <button type="button" data-pick-size="3" aria-pressed="false">150%</button>
    </div>
  </div>
  <div class="a11y__toggles">
    <button type="button" data-pick="contrast" aria-pressed="false"><span class="a11y__box" aria-hidden="true"></span>Higher contrast</button>
    <button type="button" data-pick="links" aria-pressed="false"><span class="a11y__box" aria-hidden="true"></span>Underline links</button>
    <button type="button" data-pick="spacing" aria-pressed="false"><span class="a11y__box" aria-hidden="true"></span>More text spacing</button>
    <button type="button" data-pick="motion" aria-pressed="false"><span class="a11y__box" aria-hidden="true"></span>Stop animations</button>
  </div>
  <button type="button" class="a11y__reset" data-pick-reset>Reset</button>
</div>
